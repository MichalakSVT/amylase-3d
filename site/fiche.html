<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amylase – réalité augmentée avec la fiche</title>
<meta name="theme-color" content="#1f1b2b">
<style>
:root { --ink: #1f1b2b; --muted: #5d5770; --line: #dcd7e8; --violet: #6a3db8; --violet-dark: #5a339e; --violet-soft: #efe9fa;
  --font: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: #1f1b2b; color: var(--ink); font-family: var(--font); overflow: hidden; }
#ar { position: fixed; inset: 0; }
#ar video { object-fit: cover; }
.top { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 8px max(10px, env(safe-area-inset-right, 0px)) 8px max(10px, env(safe-area-inset-left, 0px)); }
.chip { background: rgba(255,255,255,.94); border-radius: 10px; padding: 6px 10px; font-size: .9rem; box-shadow: 0 1px 6px rgba(0,0,0,.2); }
.chip a { color: var(--violet-dark); font-weight: 700; text-decoration: none; }
.status { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 5; max-width: min(90vw, 460px); text-align: center;
  background: rgba(255,255,255,.95); border-radius: 14px; padding: 14px 18px; font-size: 1.05rem; box-shadow: 0 2px 14px rgba(0,0,0,.25); }
.status strong { color: var(--violet-dark); }
.status button { margin-top: 12px; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 0; background: var(--violet); color: #fff; font: 700 1.05rem var(--font); cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .82rem; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.player { position: fixed; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px));
  bottom: calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 5; margin: 0 auto; max-width: 760px;
  background: rgba(255,255,255,.96); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 2px 14px rgba(0,0,0,.25); }
.cap { margin: 0; font-size: 1rem; line-height: 1.3; }
.cap strong { color: var(--violet-dark); }
.pctl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pctl button { width: 48px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: 700 1.05rem var(--font); cursor: pointer; }
.pctl button.pp { width: 60px; background: var(--violet); color: #fff; border-color: var(--violet); }
.speed { margin-left: auto; font-size: .88rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.speed select { font: 600 .95rem var(--font); height: 40px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 0 6px; }
.tools { position: fixed; right: max(8px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-60%); z-index: 5; display: flex; flex-direction: column; gap: 8px; }
.tools button { width: 52px; height: 52px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.94); color: var(--ink); font: 700 1.5rem var(--font); cursor: pointer; box-shadow: 0 1px 6px rgba(0,0,0,.2); }
.tools .zoomval { text-align: center; font-size: .85rem; font-weight: 700; background: rgba(255,255,255,.94); border-radius: 8px; padding: 2px 0; }
#touch { position: fixed; inset: 0; z-index: 4; touch-action: none; }
.hint { position: fixed; left: 50%; top: calc(56px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 5; max-width: 92vw; text-align: center;
  background: rgba(31,27,43,.85); color: #fff; border-radius: 10px; padding: 6px 12px; font-size: .92rem; pointer-events: none; }
button:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid #f0b400; outline-offset: 2px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./lib/three/build/three.module.js",
  "three/addons/": "./lib/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ar"></div>

<div id="touch" hidden></div>
<div class="tools" id="tools" hidden>
  <button type="button" id="z-in" aria-label="Agrandir" title="Agrandir">+</button>
  <div class="zoomval" id="zoomval" aria-live="polite">× 1</div>
  <button type="button" id="z-out" aria-label="Réduire" title="Réduire">−</button>
  <button type="button" id="z-reset" aria-label="Taille et orientation de départ" title="Taille et orientation de départ">⟲</button>
</div>
<div class="hint" id="hint" hidden>Glissez un doigt pour tourner la molécule · pincez pour l’agrandir</div>

<div class="top">
  <span class="chip"><strong>L’amylase en 3D</strong> · réalité augmentée avec la fiche</span>
  <span class="chip"><a href="./">Vue 3D complète</a></span>
</div>

<div class="status" id="status">
  <div id="status-text">Posez la fiche imprimée à plat, bien éclairée. La caméra de l’appareil va s’ouvrir : filmez toute la fiche.</div>
  <button type="button" id="start">Démarrer la caméra</button>
</div>

<div class="player" id="player" hidden>
  <div class="legend" id="legend"></div>
  <p class="cap"><strong id="cap-title"></strong> <span id="cap-text"></span></p>
  <div class="pctl">
    <button type="button" id="p-prev" aria-label="Étape précédente" title="Étape précédente">⏮</button>
    <button type="button" id="pp" class="pp" aria-label="Mettre en pause" title="Pause">❚❚</button>
    <button type="button" id="p-next" aria-label="Étape suivante" title="Étape suivante">⏭</button>
    <label class="speed">Vitesse
      <select id="speed">
        <option value="0.5">× 0,5</option>
        <option value="0.75">× 0,75</option>
        <option value="1" selected>× 1</option>
        <option value="1.5">× 1,5</option>
      </select>
    </label>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MindARThree } from './lib/mindar/mindar-image-three.prod.js';

const $ = (id) => document.getElementById(id);
const LEGENDS = {
  1: [['linear-gradient(90deg,#2bb3d9,#4b1f8f)', 'Chaîne d’acides aminés'], ['#6a3db8', 'Surface de la protéine']],
  2: [['#6a3db8', 'Amylase'], ['#1bc689', 'Site actif']],
  3: [['#6a3db8', 'Amylase'], ['#1bc689', 'Site actif'], ['#f4a600', 'Substrat : amidon']],
  4: [['#6a3db8', 'Amylase'], ['#1bc689', 'Site actif'], ['#e31c2e', 'Liaison coupée'], ['#f4a600', 'Produits']],
  5: [['#6a3db8', 'Amylase'], ['#f4a600', 'Amidon (α-1,4)'], ['#2f6db5', 'Cellulose (β-1,4)']],
};
let META, mixer, action, current = -1, view = null;

// ------------------------------------------------------------ taille et orientation choisies par l'élève
const S0 = 1.5, SMIN = S0 * 0.3, SMAX = S0 * 8;   // taille de départ (1 = première version) ; zoom de × 0,3 à × 8
let scale = S0;
function applyScale() {
  view.spin.scale.setScalar(scale);
  view.base.position.set(-0.2, -0.05, view.halfH * S0);    // le zoom se fait autour du centre de la protéine, qui reste fixe au-dessus du dessin
  $('zoomval').textContent = '× ' + String(Math.round(scale / S0 * 10) / 10).replace('.', ',');
}
function setScale(s) { scale = Math.min(SMAX, Math.max(SMIN, s)); applyScale(); }
function resetView() { view.spin.quaternion.identity(); scale = S0; applyScale(); }
const _q = new THREE.Quaternion(), _qp = new THREE.Quaternion(), _ax = new THREE.Vector3();
// rotation autour d'un axe exprimé dans le repère de la caméra (rotation « boule » qui suit le doigt)
function rotateCam(axis, angle) {
  if (!angle) return;
  _ax.copy(axis).applyQuaternion(view.camera.getWorldQuaternion(_q));
  _ax.applyQuaternion(view.base.getWorldQuaternion(_qp).invert()).normalize();
  view.spin.quaternion.premultiply(_q.setFromAxisAngle(_ax, angle));
}
function hideHint() { $('hint').hidden = true; }
function setupGestures() {
  const el = $('touch'), pts = new Map();
  let lastDist = 0, lastAng = 0;
  const two = () => { const [a, b] = [...pts.values()]; return { d: Math.hypot(b.x - a.x, b.y - a.y), a: Math.atan2(b.y - a.y, b.x - a.x) }; };
  el.addEventListener('pointerdown', (e) => {
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) { const t = two(); lastDist = t.d; lastAng = t.a; }
  });
  el.addEventListener('pointermove', (e) => {
    const p = pts.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pts.size === 1) {
      const k = 1.5 * Math.PI / Math.min(innerWidth, innerHeight);   // 3/4 de tour pour la largeur de l'écran
      const len = Math.hypot(dx, dy);
      if (len) { rotateCam(new THREE.Vector3(dy / len, dx / len, 0), len * k); hideHint(); }
    } else if (pts.size === 2) {
      const t = two();
      if (lastDist > 0) setScale(scale * t.d / lastDist);
      let da = t.a - lastAng; if (da > Math.PI) da -= 2 * Math.PI; if (da < -Math.PI) da += 2 * Math.PI;
      rotateCam(new THREE.Vector3(0, 0, 1), -da);                       // rotation à deux doigts dans le plan de l'écran
      lastDist = t.d; lastAng = t.a; hideHint();
    }
  });
  const up = (e) => { pts.delete(e.pointerId); if (pts.size === 2) { const t = two(); lastDist = t.d; lastAng = t.a; } };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  el.addEventListener('wheel', (e) => { e.preventDefault(); setScale(scale * Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
}

function status(html, withButton) {
  $('status').hidden = !html;
  if (html) $('status-text').innerHTML = html;
  $('start').hidden = !withButton;
}
function seg(i) { return META.anim.segments[String(i + 1)]; }
function stepAt(t) { for (let i = 0; i < 5; i++) { const s = seg(i); if (t >= s[0] && t < s[1]) return i; } return 4; }
function showStep(i) {
  current = i;
  const c = META.captions[String(i + 1)];
  $('cap-title').textContent = c[0]; $('cap-text').textContent = c[1];
  const lg = $('legend'); lg.textContent = '';
  for (const [col, txt] of LEGENDS[i + 1]) {
    const s = document.createElement('span'), dot = document.createElement('i');
    dot.style.background = col; s.append(dot, txt); lg.append(s);
  }
}
function goTo(i) { i = (i + 5) % 5; action.time = seg(i)[0] + 0.05; mixer.update(0); showStep(i); }
function setPlaying(p) {
  action.paused = !p;
  $('pp').textContent = p ? '❚❚' : '▶';
  $('pp').title = p ? 'Pause' : 'Reprendre';
  $('pp').setAttribute('aria-label', p ? 'Mettre en pause' : 'Reprendre la visite');
}

async function start() {
  status('Chargement du modèle et de la caméra…', false);
  try {
    META = await (await fetch('models/meta.json')).json();
    const mindar = new MindARThree({
      container: $('ar'), imageTargetSrc: 'models/fiche.mind',
      uiLoading: 'no', uiScanning: 'no', uiError: 'no', filterMinCF: 0.0001, filterBeta: 0.001,
    });
    const { renderer, scene, camera } = mindar;
    scene.add(new THREE.HemisphereLight(0xffffff, 0x555566, 1.6));
    const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(0.3, -0.5, 1); scene.add(sun);
    const gltf = await new GLTFLoader().loadAsync('models/visite.glb');
    const model = gltf.scene;
    // Les panneaux de texte intégrés au modèle sont remplacés ici par le lecteur à l'écran
    model.traverse((o) => { if (o.isMesh && /^panneau/.test(o.material.name)) o.visible = false; });
    // La fiche est le plan XY de l'ancre (largeur 1). Emboîtement :
    // base (position sur le dessin) > spin (orientation et taille choisies par l'élève) > model (centré sur la protéine).
    model.rotation.x = Math.PI / 2;          // modèle debout sur la fiche (axe y du modèle -> axe z de l'ancre)
    const box = new THREE.Box3();
    model.traverse((o) => { if (o.isMesh && o.material.name === 'surface_transparente') { o.geometry.computeBoundingBox(); box.union(o.geometry.boundingBox); } });
    const center = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
    model.position.copy(center.clone().applyEuler(model.rotation)).negate();   // rotations et zoom autour du centre de la protéine
    const halfH = size.y / 2;
    const spin = new THREE.Group(); spin.add(model);
    const base = new THREE.Group(); base.add(spin);
    const holder = base;
    view = { base, spin, halfH, camera };
    resetView();
    const anchor = mindar.addAnchor(0);
    anchor.group.add(holder);
    mixer = new THREE.AnimationMixer(model);
    action = mixer.clipAction(gltf.animations[0]); action.play();
    mixer.timeScale = +$('speed').value;
    let hintShown = false;   // aide aux gestes, affichée une fois à la première détection de la fiche
    anchor.onTargetFound = () => { status('', false); if (!hintShown) { hintShown = true; $('hint').hidden = false; setTimeout(hideHint, 8000); } };
    anchor.onTargetLost = () => status('Fiche perdue de vue : <strong>filmez toute la fiche</strong>, posée à plat et bien éclairée.', false);
    await mindar.start();
    status('<strong>Filmez toute la fiche</strong>, posée à plat et bien éclairée.', false);
    $('player').hidden = false; $('tools').hidden = false; $('touch').hidden = false; setupGestures();
    const m = /^#etape([1-5])$/.exec(location.hash);
    goTo(m ? +m[1] - 1 : 0); setPlaying(true);
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      mixer.update(clock.getDelta());
      const i = stepAt(action.time);
      if (i !== current) showStep(i);
      renderer.render(scene, camera);
    });
    window.addEventListener('pagehide', () => mindar.stop());
    window.__fiche = { mixer, action, anchor, view, setScale, rotateCam, get scale() { return scale; } };
  } catch (e) {
    console.error(e);
    const refused = e && (e.name === 'NotAllowedError' || /Permission|denied/i.test(String(e.message)));
    status(refused
      ? 'La caméra a été refusée. Autorisez l’accès à la caméra pour ce site dans les réglages du navigateur, puis rechargez la page.'
      : 'La réalité augmentée n’a pas pu démarrer sur cet appareil (caméra indisponible ou navigateur trop ancien). Utilisez la <a href="./">vue 3D</a>.', false);
  }
}

$('start').addEventListener('click', start);
$('z-in').addEventListener('click', () => setScale(scale * 1.4));
$('z-out').addEventListener('click', () => setScale(scale / 1.4));
$('z-reset').addEventListener('click', resetView);
$('pp').addEventListener('click', () => setPlaying(action.paused));
$('p-prev').addEventListener('click', () => goTo(current - 1));
$('p-next').addEventListener('click', () => goTo(current + 1));
$('speed').addEventListener('change', (e) => { if (mixer) mixer.timeScale = +e.target.value; });
</script>
</body>
</html>
